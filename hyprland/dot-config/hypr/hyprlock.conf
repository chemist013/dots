general {
    hide_cursor = true
    ignore_emprt_input = true
    immediate_render = false
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 5000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = 
	path = ~/Pictures/Wallpapers/artemis-ii-eclipse1.jpg

	blur_passes = 1
	blur_size = 1
}

input-field {
    monitor = eDP-1
    size = 15%, 5%
    outline_thickness = 3
    
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    dots_text_format = 

	inner_color = rgba(ffffffaa)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    font_color = rgba(4f4f4fff)
    font_family = JetBrains Mono NL
    
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
	
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
	fail_text = Try again
	swap_font_color = false
	
	position = 0, -25%
	halign = center
	valign = center
	zindex = 0
}

# Time
label {
	monitor = eDP-1
	text = cmd[update:1000] echo $(date +"%I:%M%P")
	text_align = center
	
	color = rgba(254, 254, 254, 1.0)
	font_size = 64
	font_family = JetBrains Mono NL Bold
	
	rotate = 0
	position = 0, 27.5%
	halign = center
	valign = center

    shadow_passes = 3 
    shadow_size = 3
    shadow_color = rgba(00ffccaa)
}

# Date
label {
	monitor = eDP-1
	text = cmd[update:1000] echo $(date +"%a %d %b")
	text_align = center
	
	color = rgba(254, 254, 254, 1.0)
	font_size = 24
	font_family = JetBrains Mono NL
	
	rotate = 0
	position = 0, 15%
	halign = center
	valign = center

    shadow_passes = 3 
    shadow_size = 3
    shadow_color = rgba(00ffccaa)
}

# Welcome
label {
	monitor = eDP-1
	text = $USER
	text_align = center
	
	color = rgba(254, 254, 254, 1.0)
	font_size = 14
	font_family = JetBrains Mono NL Light
	
	rotate = 0
	position = 0, -30%
	halign = center
	valign = center

    shadow_passes = 3 
    shadow_size = 3
    shadow_color = rgba(00ffccaa)
}
